[workspace]
resolver = "2"
members = ["crates/uncoil-core", "crates/uncoil-hid", "apps/uncoild", "apps/uncoil-cli", "apps/uncoil/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/justinthevoid/uncoil"
rust-version = "1.85"

[workspace.dependencies]
uncoil-core = { path = "crates/uncoil-core" }
uncoil-hid = { path = "crates/uncoil-hid" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
hidapi = { version = "2", default-features = false, features = ["windows-native"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
