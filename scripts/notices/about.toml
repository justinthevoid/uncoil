# cargo-about: the licences of the Rust crates compiled into uncoil's binaries, for THIRD_PARTY_NOTICES.md
# (`node scripts/notices/notices.mjs`). uncoil's own crates are GPL-3.0-or-later and left out (publish = false).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
