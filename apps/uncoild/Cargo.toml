[package]
name = "uncoild"
description = "uncoil background daemon: drives device lighting with no UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uncoil-core.workspace = true
uncoil-hid.workspace = true
uncoil-openrgb.workspace = true
hidapi.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# `uncoild --fake`: serve the control pipe for fake devices (development / CLI testing only)
fake = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_ProcessStatus",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
] }
