name: audit

# RustSec advisories for the Cargo workspace, weekly and whenever the lockfile changes.

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit
      # Both ignored advisories come in only through Tauri's Linux GTK stack, which is not built for Windows:
      # glib (RUSTSEC-2024-0429) and proc-macro-error, unmaintained (RUSTSEC-2024-0370), via glib-macros.
      # A new advisory fails the run, and GitHub emails the failure.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0370
