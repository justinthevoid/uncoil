name: release

# Push a tag like v0.1.0 (or v0.2.0-rc.1 for a pre-release) to build Windows binaries and
# attach them to a DRAFT GitHub Release. Nothing is published until you review the draft
# and press "Publish release".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds and tests with a read-only token; nothing here can touch the repository or its releases.
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches every version field
        shell: pwsh
        run: |
          $want   = $env:TAG.TrimStart('v')
          $cargo  = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tauri  = (Get-Content apps/uncoil/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg    = (Get-Content apps/uncoil/package.json -Raw | ConvertFrom-Json).version
          "tag $want / Cargo.toml $cargo / tauri.conf.json $tauri / package.json $pkg"
          if ($want -ne $cargo -or $want -ne $tauri -or $want -ne $pkg) {
            Write-Error "Tag $env:TAG does not match the versions in Cargo.toml, tauri.conf.json and package.json."
            exit 1
          }

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/uncoil/pnpm-lock.yaml

      - name: Test
        run: cargo test --locked -p uncoil-core -p uncoil-hid -p uncoild -p uncoil-cli -p uncoil-openrgb

      - name: Build daemon
        run: cargo build --locked --release -p uncoild -p uncoil-cli

      # The notices ship in the installer and the release; a stale file fails the release (regenerate with
      # node scripts/notices/notices.mjs and commit it).
      - name: Check THIRD_PARTY_NOTICES.md
        run: |
          cargo install cargo-about --locked --features cli --version 0.9.2
          pnpm --dir apps/uncoil install --frozen-lockfile
          node scripts/notices/notices.mjs --check

      - name: Build desktop app and installer
        working-directory: apps/uncoil
        run: pnpm tauri build

      - name: Stage release files
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/uncoild.exe dist/uncoild.exe
          Copy-Item target/release/uncoil.exe dist/uncoil.exe
          Copy-Item scripts/install-task.ps1 dist/install-task.ps1
          Copy-Item scripts/uninstall-task.ps1 dist/uninstall-task.ps1
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          $installers = Get-ChildItem target/release/bundle/nsis/*.exe
          if (-not $installers) { Write-Error "No NSIS installer found under target/release/bundle/nsis"; exit 1 }
          foreach ($i in $installers) { Copy-Item $i.FullName "dist/uncoil-app-$ver-x64-setup.exe" }
          Push-Location dist
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uncoil-${{ github.ref_name }}-windows
          path: dist/*

  # Only this job can write, and it runs no project code: it downloads the built files and drafts the release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uncoil-${{ github.ref_name }}-windows
          path: dist

      - name: Check the checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt

      # Signed build provenance for every file: `gh attestation verify <file> --repo justinthevoid/uncoil`
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: uncoil ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/uncoild.exe
            dist/uncoil.exe
            dist/install-task.ps1
            dist/uninstall-task.ps1
            dist/uncoil-app-*-x64-setup.exe
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.md
            dist/SHA256SUMS.txt
          body: |
            **Windows 10/11 x64. Pre-release software; read the notes below before installing.**

            | File | What |
            |---|---|
            | `uncoild.exe` | the lighting daemon (single executable) |
            | `uncoil.exe` | the command line: status, devices, key maps, DPI and other device settings |
            | `install-task.ps1` | installs the daemon as a logon task: `powershell -ExecutionPolicy Bypass -File install-task.ps1 -Exe .\uncoild.exe` |
            | `uninstall-task.ps1` | removes the logon task and the installed daemon |
            | `uncoil-app-*-x64-setup.exe` | the optional desktop app (settings and live preview); does not install the daemon |
            | `LICENSE.txt`, `THIRD_PARTY_NOTICES.md` | uncoil's licence (GPL-3.0-or-later) and the licences of the code it carries |
            | `SHA256SUMS.txt` | checksums: `Get-FileHash <file> -Algorithm SHA256` |

            - Quit Razer Synapse first; two programs driving one device don't mix.
            - The binaries are not code-signed yet, so Windows SmartScreen may warn.
            - The daemon runs unelevated, as you; only the optional `-OpenRgb` task runs elevated (see SECURITY.md).

            Changes: see CHANGELOG.md and the generated notes below.
