# GitHub Pages deployment for the uncoil website + docs (site/).
#
# Manual-only for now: Pages can't publish from a private repository on a free plan. When the repo goes
# public, set Settings > Pages > Source to "GitHub Actions" and restore the push trigger below.
#
# The site build reads files outside site/ (devices/*.toml for the device tables, and the desktop app's
# effect maths and desk snapshot in apps/uncoil/src/lib), so it needs the whole repository checked out.
#
# Served at https://justinthevoid.github.io/uncoil/ by default. For a custom domain, set the SITE and BASE
# env vars on the build step (e.g. SITE: https://uncoil.example, BASE: /) and add the domain in
# Settings > Pages; see site/README.md.

name: Deploy site

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['site/**', 'devices/**', 'apps/uncoil/src/lib/effect.ts', 'apps/uncoil/src/lib/types.ts', 'apps/uncoil/src/lib/mock/desk.json']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The site imports the app's effect maths; the app's tsconfig extends SvelteKit's generated one.
      - working-directory: apps/uncoil
        run: pnpm install --frozen-lockfile && pnpm exec svelte-kit sync

      - run: pnpm build
        # env:
        #   SITE: https://uncoil.example
        #   BASE: /

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
