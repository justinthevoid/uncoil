name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Daemon and pure crates. uncoil-gui (apps/uncoil/src-tauri) is excluded here because it
  # needs the front end built first; the gui job covers it.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p uncoil-core -p uncoil-hid -p uncoild -p uncoil-cli --all-targets -- -D warnings
      - run: cargo test -p uncoil-core -p uncoil-hid -p uncoild -p uncoil-cli
      - run: cargo build --release -p uncoild -p uncoil-cli
      - uses: actions/upload-artifact@v4
        with:
          name: uncoild
          path: target/release/uncoild.exe

  # Desktop app: SvelteKit front end, then the Tauri crate (package uncoil-gui) that embeds it.
  gui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/uncoil
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          # apps/uncoil/package.json has no "packageManager" field, so the version must be given here.
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/uncoil/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build -p uncoil-gui
        working-directory: .
      # Checks the browser mock (src/lib/mock) still matches the real desk layout.
      - run: cargo test -p uncoil-gui
        working-directory: .

  # Marketing site. Every step is skipped until site/package.json exists.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        if: hashFiles('site/package.json') != ''
        run: echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: 12
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
      - if: steps.detect.outputs.present == 'true'
        working-directory: site
        run: pnpm install --frozen-lockfile
      # The site imports the app's effect maths; the app's tsconfig extends SvelteKit's generated one.
      - if: steps.detect.outputs.present == 'true'
        working-directory: apps/uncoil
        run: pnpm install --frozen-lockfile && pnpm exec svelte-kit sync
      - if: steps.detect.outputs.present == 'true'
        working-directory: site
        run: pnpm build
