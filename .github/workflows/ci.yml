name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Daemon and pure crates. uncoil-gui (apps/uncoil/src-tauri) is excluded here because it
  # needs the front end built first; the gui job covers it.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p uncoil-core -p uncoil-hid -p uncoild -p uncoil-cli --all-targets -- -D warnings
      - run: cargo test -p uncoil-core -p uncoil-hid -p uncoild -p uncoil-cli
      # The release build (LTO, one codegen unit) is the slowest step, so pull requests skip it.
      - if: github.event_name == 'push'
        run: cargo build --release -p uncoild -p uncoil-cli
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uncoild
          path: target/release/uncoild.exe

  # Desktop app: SvelteKit front end, then the Tauri crate (package uncoil-gui) that embeds it.
  gui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/uncoil
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/uncoil/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # svelte-check: catches drift between src/lib/types.ts and the daemon's IPC types.
      - run: pnpm check
      - run: pnpm build
      - run: cargo clippy -p uncoil-gui --all-targets -- -D warnings
        working-directory: .
      # Checks the browser mock (src/lib/mock) still matches the real desk layout.
      - run: cargo test -p uncoil-gui
        working-directory: .

  # Marketing site and docs.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - working-directory: site
        run: pnpm install --frozen-lockfile
      # The site imports the app's effect maths; the app's tsconfig extends SvelteKit's generated one.
      - working-directory: apps/uncoil
        run: pnpm install --frozen-lockfile && pnpm exec svelte-kit sync
      - working-directory: site
        run: pnpm build

  # Device files: checks Rust's parser doesn't (matrix names vs layout names, key ids, unique product ids),
  # and that the experimental files are exactly what the generator produces.
  devices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 tools/devices/validate.py
      - run: python3 tools/devices/gen_experimental.py --check
