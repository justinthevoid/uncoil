version: 2

updates:
  # Rust workspace (crates/*, apps/uncoild, apps/uncoil/src-tauri share one Cargo.lock)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # Desktop app front end (pnpm)
  - package-ecosystem: npm
    directory: /apps/uncoil
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      svelte:
        patterns: ["svelte", "svelte-check", "@sveltejs/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The website.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      site-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
