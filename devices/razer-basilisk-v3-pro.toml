# Razer Basilisk V3 Pro. LED order (OpenRGB): 0 scroll wheel, 1 logo, 2..12 underglow strip.

id = "razer-basilisk-v3-pro"
name = "Razer Basilisk V3 Pro"
kind = "mouse"
vendor_id = 0x1532
features = ["lighting", "hw_effects", "keymap", "profiles", "dpi", "poll_rate", "power", "scroll"]
# dpi, poll_rate, power and scroll come from OpenRazer and have not been read on this mouse yet: their writes
# wait for uncoil's read-only checks (`uncoil check mouse`) like an experimental device's.
unverified = ["dpi", "poll_rate", "power", "scroll"]

[[usb]]
product_id = 0x00AA
connection = "wired"
interface = 0
usage_page = 0x01
usage = 0x02
transaction_id = 0x1F

[usb.transaction_ids]
# From OpenRazer, not yet read on this mouse: the low-battery threshold (07/01, 07/81) is the only command
# it sends to this mouse with 0xFF. Everything else, DPI, poll rate and the other power commands included,
# uses 0x1F.
low_battery = 0xFF

[[usb]]
product_id = 0x00AB
connection = "dongle"   # answers status 0x04 (timeout) while the mouse is on its cable
interface = 0
usage_page = 0x01
usage = 0x02
transaction_id = 0x1F

[usb.transaction_ids]
low_battery = 0xFF   # as on the wired endpoint (OpenRazer, not yet read on this mouse)

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
rows = 1
cols = 13
names = [["Scroll Wheel", "Logo", "Strip 1", "Strip 2", "Strip 3", "Strip 4", "Strip 5", "Strip 6", "Strip 7", "Strip 8", "Strip 9", "Strip 10", "Strip 11"]]

[layout]
type = "points"
# footprint ~130 x 75 mm; lit body drawn as an ellipse
width = 2.8
depth = 6.4
# (x, y) relative to the mouse centre, in key units. Strip runs down the left side, around the back,
# and up the right side (order verified visually 2026-10-03).
points = [
  [0.0, -2.2], [0.0, 1.8],
  [-1.4, -2.6], [-1.4, -1.25], [-1.4, 0.1], [-1.4, 1.45], [-1.4, 3.0],
  [0.0, 3.0],
  [1.4, 2.8], [1.4, 1.45], [1.4, 0.1], [1.4, -1.25], [1.4, -2.6],
]

[hw_effects]
# Whole device (LED id 0), as OpenRazer. The mouse lists 0,1,2,3,5,8 for each of its regions (0F/81);
# wave comes from OpenRazer (OpenRGB notes the list is not exhaustive on Basilisk V3 Pros).
led = 0x00
effects = ["off", "static", "breathing", "spectrum", "wave", "reactive"]

[keymap]
# Mouse variant of the onboard map: 02/8C get, 02/0C set (OpenSynapse ViperObmProtocol). Button ids are the
# 13 the mouse lists itself (02/84, read 2026-10-03); Synapse's inputID names in comments. Defaults are what
# Synapse's logs and the mouse report for an unmodified profile. The firmware echoes layer 0 for Hypershift
# reads and both layers currently hold the same mapping.
get = 0x8C
set = 0x0C
layers = ["normal", "hypershift"]
keys = [
  { id = 1, name = "LEFT_CLICK", default = "button 1" },        # LeftClick
  { id = 2, name = "RIGHT_CLICK", default = "button 2" },       # RightClick
  { id = 3, name = "WHEEL_CLICK", default = "button 3" },       # ScrollButton
  { id = 4, name = "BACK", default = "button 4" },              # Button4
  { id = 5, name = "FORWARD", default = "button 5" },           # Button5
  { id = 9, name = "WHEEL_UP", default = "button 9" },          # ScrollUp
  { id = 10, name = "WHEEL_DOWN", default = "button 10" },       # ScrollDown
  { id = 52, name = "WHEEL_LEFT", default = "button 104" },     # ScrollLeft (tilt)
  { id = 53, name = "WHEEL_RIGHT", default = "button 105" },    # ScrollRight (tilt)
  { id = 14, name = "PROFILE_BUTTON", default = "profile 4" },  # DKM_SB_01: next profile
  { id = 15, name = "CLUTCH", default = "dpi 5 1 144 1 144" },  # DKM_SB_02: DPI clutch, 400 x 400
  { id = 96, name = "DPI_BUTTON", default = "dpi 6" },          # DKM_SB_03: DPI cycle up
  { id = 106, name = "SCROLL_MODE", default = "shortcut 1" },   # DKM_M_106: free-spin / notched toggle
]

# ---- from OpenRazer, not yet read on this mouse ----------------------------------------------------------
# Shared mouse commands (razerchromacommon.c, razermouse_driver.c at a84cd0ae). Listed in `unverified`
# above, so uncoil reads each value back (check) before it changes anything.

[dpi]
# 04/05 set, 04/85 get; NOSTORE like almost every modern Razer mouse (lasts until the DPI button changes it).
min = 100
max = 30000
storage = "nostore"
stages_max = 5        # 04/06, 04/86

[poll_rate]
kind = "classic"      # 00/05, 00/85
rates = [125, 500, 1000]

[power]
battery = true        # 07/80 level, 07/84 charging
idle = true           # 07/03, 07/83: 60-900 s
low_battery = true    # 07/01, 07/81 (transaction id 0xFF, see [usb.transaction_ids])

[scroll]
# Stored in the mouse (VARSTORE); OpenRazer sends all three with 0x1F, the endpoint default.
mode = true           # 02/14, 02/94: tactile / free spin
acceleration = true   # 02/16, 02/96
smart_reel = true     # 02/17, 02/97
