# Razer DeathAdder V2 (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - conflict: PID 0x0084 transaction id: OpenRGB 0x1F vs OpenRazer driver 0x3F
#   - conflict: PID 0x0084 matrix: OpenRGB 1x2 vs OpenRazer 1x1
#   - conflict: Zones: OpenRazer MATRIX_DIMS [1,1] but separate logo (0x04) and scroll (0x01) zone methods;
#   OpenRGB uses one 1x2 matrix (logo + scroll wheel).

id = "razer-deathadder-v2"
name = "Razer DeathAdder V2"
kind = "mouse"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects", "keymap", "profiles", "dpi", "poll_rate"]

[sources]
openrazer = "mouse.py:1226 RazerDeathAdderV2; razermouse_driver.c USB_DEVICE_ID_RAZER_DEATHADDER_V2 (a84cd0ae)"
openrgb = "RazerDevices.cpp:5749 deathadder_v2_device; RazerControllerDetect.cpp:340 (df3024be)"

# wired: OpenRazer RazerDeathAdderV2 (USB_DEVICE_ID_RAZER_DEATHADDER_V2); OpenRGB "Razer DeathAdder V2".
[[usb]]
product_id = 0x0084
connection = "wired"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# OpenRazer 0x3F, OpenRGB 0x1F, no recommendation: lighting (custom frames, effects) uses OpenRGB's 0x1F,
# everything else OpenRazer's 0x3F. Confidence: low.
# frame: 0x1F (OpenRGB / research); OpenRazer sends matrix_custom_frame 0x3F, matrix_effect_custom 0x3F.
# effect: 0x1F (OpenRGB / research); OpenRazer sends led_brightness 0x3F, matrix_effect_breath_common 0x3F,
# matrix_effect_none_common 0x3F, matrix_effect_reactive_common 0x3F, matrix_effect_spectrum_common 0x3F,
# matrix_effect_static_common 0x3F.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x3F

[usb.transaction_ids]
frame = 0x1F
effect = 0x1F

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
# OpenRGB 1x2 (scroll wheel, logo, in that order); OpenRazer MATRIX_DIMS 1x1 but with separate scroll (0x01) and
# logo (0x04) zone commands, so the mouse has two LEDs. Using 1x2.
rows = 1
cols = 2
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Scroll Wheel", "Logo"],
]

[layout]
type = "points"
width = 2.6
depth = 6.4
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
points = [[0.0, -2.2], [0.0, 1.6]]

[hw_effects]
# OpenRGB sends effects to LED 0x00; OpenRazer only has per-zone effects (logo 0x04, scroll 0x01).
# Effects: OpenRazer's list for this device, mapped to uncoil's names. OpenRazer has no whole-device effects
# here; the list is its per-zone list.
led = 0x00
effects = ["off", "static", "breathing", "spectrum", "reactive"]

[dpi]
min = 100   # Neither source gives a minimum; 100 is the floor uncoil uses for the Basilisk V3 Pro and what Synapse offers on current mice.
max = 20000   # OpenRazer daemon DPI_MAX
# 04/05 storage byte NOSTORE, as OpenRazer sends it for almost every current mouse.
storage = "nostore"
stages_max = 0

[poll_rate]
# Rates and command from OpenRazer (daemon default (device_base.py:115)).
kind = "classic"
rates = [125, 500, 1000]
set_twice = false

[keymap]
# Contract section 2: experimental mice list only the common buttons; extra buttons wait for a hardware read
# (02/84). Ids and defaults as devices/razer-basilisk-v3-pro.toml (read from that mouse 2026-10-03).
get = 0x8C
set = 0x0C
layers = ["normal", "hypershift"]
keys = [
  { id = 1, name = "LEFT_CLICK", default = "button 1" },
  { id = 2, name = "RIGHT_CLICK", default = "button 2" },
  { id = 3, name = "WHEEL_CLICK", default = "button 3" },
  { id = 4, name = "BACK", default = "button 4" },
  { id = 5, name = "FORWARD", default = "button 5" },
  { id = 9, name = "WHEEL_UP", default = "button 9" },
  { id = 10, name = "WHEEL_DOWN", default = "button 10" },
]
