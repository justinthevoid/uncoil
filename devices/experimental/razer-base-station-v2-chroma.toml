# Razer Base Station V2 Chroma (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).

id = "razer-base-station-v2-chroma"
name = "Razer Base Station V2 Chroma"
kind = "other"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects"]

[sources]
openrazer = "accessory.py:158 RazerBaseStationV2Chroma; razeraccessory_driver.c USB_DEVICE_ID_RAZER_BASE_STATION_V2_CHROMA (a84cd0ae)"
openrgb = "RazerDevices.cpp:9003 base_station_v2_device; RazerControllerDetect.cpp:422 (df3024be)"

# wired: OpenRazer RazerBaseStationV2Chroma (USB_DEVICE_ID_RAZER_BASE_STATION_V2_CHROMA); OpenRGB "Razer Base
# Station V2 Chroma".
[[usb]]
product_id = 0x0F20
connection = "wired"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
transaction_id = 0x1F

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
rows = 1
cols = 8
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Base 1", "Base 2", "Base 3", "Base 4", "Base 5", "Base 6", "Base 7", "Base 8"],
]

[layout]
type = "points"
width = 5.0
depth = 5.0
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
# Headset stand: 8 LEDs drawn as a ring around the base. Approximate.
points = [[0.0, -2.2], [1.56, -1.56], [2.2, 0.0], [1.56, 1.56], [0.0, 2.2], [-1.56, 1.56], [-2.2, 0.0], [-1.56, -1.56]]

[hw_effects]
# LED id 0x00 (whole device): both sources.
# Effects: OpenRazer's list for this device, mapped to uncoil's names.
led = 0x00
effects = ["off", "static", "breathing", "spectrum", "wave"]
