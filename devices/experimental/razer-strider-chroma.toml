# Razer Strider Chroma (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - PID 0x0C05: OpenRazer sends lighting with 0x3F but other commands with 0xFF (functions: read_device_mode,
#   read_device_serial, write_device_mode)

id = "razer-strider-chroma"
name = "Razer Strider Chroma"
kind = "mousemat"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects"]

[sources]
openrazer = "mouse_mat.py:114 RazerStriderChroma; razeraccessory_driver.c USB_DEVICE_ID_RAZER_STRIDER_CHROMA (a84cd0ae)"
openrgb = "RazerDevices.cpp:7963 strider_chroma_device; RazerControllerDetect.cpp:416 (df3024be)"

# wired: OpenRazer RazerStriderChroma (USB_DEVICE_ID_RAZER_STRIDER_CHROMA); OpenRGB "Razer Strider Chroma".
[[usb]]
product_id = 0x0C05
connection = "wired"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x3F: both sources agree.
# device: OpenRazer mixes values (device_mode 0xFF, device_serial 0xFF, firmware_version 0x3F); one value per
# group fits, so it stays 0x3F.
transaction_id = 0x3F

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
rows = 1
cols = 19
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Edge 1", "Edge 2", "Edge 3", "Edge 4", "Edge 5", "Edge 6", "Edge 7", "Edge 8", "Edge 9", "Edge 10", "Edge 11", "Edge 12", "Edge 13", "Edge 14", "Edge 15", "Edge 16", "Edge 17", "Edge 18", "Edge 19"],
]

[layout]
type = "points"
width = 47.2
depth = 19.4
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
# 900 x 370 mm desk mat. The 19 LEDs are drawn down the left edge, along the front and up the right edge; the
# real order is not documented. Approximate.
points = [[-23.4, -8.0], [-23.4, -4.8], [-23.4, -1.6], [-23.4, 1.6], [-23.4, 4.8], [-23.4, 8.0], [-19.5, 9.5], [-13.0, 9.5], [-6.5, 9.5], [0.0, 9.5], [6.5, 9.5], [13.0, 9.5], [19.5, 9.5], [23.4, 8.0], [23.4, 4.8], [23.4, 1.6], [23.4, -1.6], [23.4, -4.8], [23.4, -8.0]]

[hw_effects]
# LED id 0x00 (whole device): both sources.
# Effects: OpenRazer's list for this device, mapped to uncoil's names. No reactive: it needs key or button input
# this device does not have.
led = 0x00
effects = ["off", "static", "breathing", "spectrum", "wave"]
