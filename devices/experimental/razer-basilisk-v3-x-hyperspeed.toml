# Razer Basilisk V3 X HyperSpeed (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - conflict: Per-LED: OpenRazer has no matrix (scroll-wheel zone effects only, LED 0x01); OpenRGB lists a 1x1
#   matrix with effects on LED 0x00.

id = "razer-basilisk-v3-x-hyperspeed"
name = "Razer Basilisk V3 X HyperSpeed"
kind = "mouse"
vendor_id = 0x1532
support = "experimental"
# OpenRGB drives a 1x1 custom frame; OpenRazer has no matrix and only scroll-wheel zone effects (LED 0x01).
# Taking the conservative side: firmware effects only, no per-LED frames, until a report says frames work.
features = ["hw_effects", "keymap", "profiles", "dpi", "poll_rate", "power"]

[sources]
openrazer = "mouse.py:1983 RazerBasiliskV3XHyperSpeed; razermouse_driver.c USB_DEVICE_ID_RAZER_BASILISK_V3_X_HYPERSPEED (a84cd0ae)"
openrgb = "RazerDevices.cpp:5314 basilisk_v3_x_hyperspeed_device; RazerControllerDetect.cpp:331 (df3024be)"

# dongle: OpenRazer RazerBasiliskV3XHyperSpeed (USB_DEVICE_ID_RAZER_BASILISK_V3_X_HYPERSPEED); OpenRGB "Razer
# Basilisk V3 X HyperSpeed".
[[usb]]
product_id = 0x00B9
connection = "dongle"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F
reply_wait_us = 31000   # OpenRazer RAZER_NEW_MOUSE_RECEIVER_WAIT_US

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
rows = 1
cols = 1
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Scroll Wheel"],
]

[layout]
type = "points"
width = 2.7
depth = 6.2
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
points = [[0.0, -2.2]]

[hw_effects]
# OpenRazer's scroll-wheel zone (0x01); OpenRGB uses 0x00.
# Effects: OpenRazer's list for this device, mapped to uncoil's names. OpenRazer has no whole-device effects
# here; the list is its per-zone list.
led = 0x01
effects = ["off", "static", "breathing", "spectrum", "wave", "reactive"]

[dpi]
min = 100   # Neither source gives a minimum; 100 is the floor uncoil uses for the Basilisk V3 Pro and what Synapse offers on current mice.
max = 18000   # OpenRazer daemon DPI_MAX
# 04/05 storage byte NOSTORE, as OpenRazer sends it for almost every current mouse.
storage = "nostore"
stages_max = 5   # OpenRazer driver limit (RAZER_MOUSE_MAX_DPI_STAGES)

[poll_rate]
# Rates and command from OpenRazer (daemon default (device_base.py:115)).
kind = "classic"
rates = [125, 500, 1000]
set_twice = false

[power]
# From OpenRazer's feature attributes for this device (charge level/status, idle time, low threshold).
battery = true
idle = true
low_battery = true

[keymap]
# Contract section 2: experimental mice list only the common buttons; extra buttons wait for a hardware read
# (02/84). Ids and defaults as devices/razer-basilisk-v3-pro.toml (read from that mouse 2026-10-03).
get = 0x8C
set = 0x0C
layers = ["normal", "hypershift"]
keys = [
  { id = 1, name = "LEFT_CLICK", default = "button 1" },
  { id = 2, name = "RIGHT_CLICK", default = "button 2" },
  { id = 3, name = "WHEEL_CLICK", default = "button 3" },
  { id = 4, name = "BACK", default = "button 4" },
  { id = 5, name = "FORWARD", default = "button 5" },
  { id = 9, name = "WHEEL_UP", default = "button 9" },
  { id = 10, name = "WHEEL_DOWN", default = "button 10" },
]
