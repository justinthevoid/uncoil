# Razer DeathAdder V3 Pro (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - No RGB; not in OpenRGB. 0x00C2/0x00C3 are alternate PIDs that OpenRazer handles identically to
#   0x00B6/0x00B7.
#   - OpenRazer daemon lists poll rates 125/500/1000 only (default list); the HyperPolling dongle (0x00B3, not
#   listed here) is a separate device in OpenRazer.

id = "razer-deathadder-v3-pro"
name = "Razer DeathAdder V3 Pro"
kind = "mouse"
vendor_id = 0x1532
support = "experimental"
# No lighting: this device has no RGB (OpenRGB does not list it).
features = ["keymap", "profiles", "dpi", "poll_rate", "power"]

[sources]
openrazer = "mouse.py:1655 RazerDeathAdderV3ProWired; mouse.py:1672 RazerDeathAdderV3ProWireless; mouse.py:1680 RazerDeathAdderV3ProWired_Alternate; mouse.py:1687 RazerDeathAdderV3ProWireless_Alternate; razermouse_driver.c USB_DEVICE_ID_RAZER_DEATHADDER_V3_PRO_WIRED, USB_DEVICE_ID_RAZER_DEATHADDER_V3_PRO_WIRELESS, USB_DEVICE_ID_RAZER_DEATHADDER_V3_PRO_WIRED_ALT, USB_DEVICE_ID_RAZER_DEATHADDER_V3_PRO_WIRELESS_ALT (a84cd0ae)"
openrgb = "not listed (no RGB)"

# wired: OpenRazer RazerDeathAdderV3ProWired (USB_DEVICE_ID_RAZER_DEATHADDER_V3_PRO_WIRED).
[[usb]]
product_id = 0x00B6
connection = "wired"
interface = 0   # one source (OpenRazer wIndex; usage page/usage unknown)
# OpenRazer matches by interface only and OpenRGB does not list this mouse (no RGB). Page 0x01 / usage 0x02 is
# what every other interface-0 Razer mouse here registers (OpenRGB detectors, uncoil's Basilisk V3 Pro).
# Confidence: medium.
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: one source.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

# dongle: OpenRazer RazerDeathAdderV3ProWireless (USB_DEVICE_ID_RAZER_DEATHADDER_V3_PRO_WIRELESS).
[[usb]]
product_id = 0x00B7
connection = "dongle"
interface = 0   # one source (OpenRazer wIndex; usage page/usage unknown)
# OpenRazer matches by interface only and OpenRGB does not list this mouse (no RGB). Page 0x01 / usage 0x02 is
# what every other interface-0 Razer mouse here registers (OpenRGB detectors, uncoil's Basilisk V3 Pro).
# Confidence: medium.
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: one source.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F
reply_wait_us = 31000   # OpenRazer RAZER_NEW_MOUSE_RECEIVER_WAIT_US

# wired: OpenRazer RazerDeathAdderV3ProWired_Alternate (USB_DEVICE_ID_RAZER_DEATHADDER_V3_PRO_WIRED_ALT).
[[usb]]
product_id = 0x00C2
connection = "wired"
interface = 0   # one source (OpenRazer wIndex; usage page/usage unknown)
# OpenRazer matches by interface only and OpenRGB does not list this mouse (no RGB). Page 0x01 / usage 0x02 is
# what every other interface-0 Razer mouse here registers (OpenRGB detectors, uncoil's Basilisk V3 Pro).
# Confidence: medium.
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: one source.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

# dongle: OpenRazer RazerDeathAdderV3ProWireless_Alternate (USB_DEVICE_ID_RAZER_DEATHADDER_V3_PRO_WIRELESS_ALT).
[[usb]]
product_id = 0x00C3
connection = "dongle"
interface = 0   # one source (OpenRazer wIndex; usage page/usage unknown)
# OpenRazer matches by interface only and OpenRGB does not list this mouse (no RGB). Page 0x01 / usage 0x02 is
# what every other interface-0 Razer mouse here registers (OpenRGB detectors, uncoil's Basilisk V3 Pro).
# Confidence: medium.
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: one source.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F
reply_wait_us = 31000   # OpenRazer RAZER_NEW_MOUSE_RECEIVER_WAIT_US

[quirks]
ack_every_report = false
custom_mode_once = true

[dpi]
min = 100   # Neither source gives a minimum; 100 is the floor uncoil uses for the Basilisk V3 Pro and what Synapse offers on current mice.
max = 35000   # OpenRazer daemon DPI_MAX
# 04/05 storage byte NOSTORE, as OpenRazer sends it for almost every current mouse.
storage = "nostore"
stages_max = 5   # OpenRazer driver limit (RAZER_MOUSE_MAX_DPI_STAGES)

[poll_rate]
# Rates and command from OpenRazer (daemon default (device_base.py:115)).
kind = "classic"
rates = [125, 500, 1000]
set_twice = false

[power]
# From OpenRazer's feature attributes for this device (charge level/status, idle time, low threshold).
battery = true
idle = true
low_battery = true

[keymap]
# Contract section 2: experimental mice list only the common buttons; extra buttons wait for a hardware read
# (02/84). Ids and defaults as devices/razer-basilisk-v3-pro.toml (read from that mouse 2026-10-03).
get = 0x8C
set = 0x0C
layers = ["normal", "hypershift"]
keys = [
  { id = 1, name = "LEFT_CLICK", default = "button 1" },
  { id = 2, name = "RIGHT_CLICK", default = "button 2" },
  { id = 3, name = "WHEEL_CLICK", default = "button 3" },
  { id = 4, name = "BACK", default = "button 4" },
  { id = 5, name = "FORWARD", default = "button 5" },
  { id = 9, name = "WHEEL_UP", default = "button 9" },
  { id = 10, name = "WHEEL_DOWN", default = "button 10" },
]
