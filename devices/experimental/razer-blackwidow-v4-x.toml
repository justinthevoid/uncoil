keys = ["M6:1.0", "gap:0.5", "Escape:1.0", "gap:1.0", "F1:1.0", "F2:1.0", "F3:1.0", "F4:1.0", "gap:0.5", "F5:1.0", "F6:1.0", "F7:1.0", "F8:1.0", "gap:0.5", "F9:1.0", "F10:1.0", "F11:1.0", "F12:1.0", "gap:0.25", "Print Screen:1.0", "Scroll Lock:1.0", "Pause:1.0"]

