# Razer BlackWidow V4 X (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - PID 0x0293: OpenRazer sends lighting with 0x1F but other commands with 0xFF (functions:
#   read_game_led_state, write_game_led_state)

id = "razer-blackwidow-v4-x"
name = "Razer BlackWidow V4 X"
kind = "keyboard"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects", "keymap", "profiles"]

[sources]
openrazer = "keyboards.py:2158 RazerBlackWidowV4X; razerkbd_driver.c USB_DEVICE_ID_RAZER_BLACKWIDOW_V4_X (a84cd0ae)"
openrgb = "RazerDevices.cpp:1993 blackwidow_v4_x_device; RazerControllerDetect.cpp:237; razer_blackwidow_v4_x_layout (RazerDevices.cpp) (df3024be)"

# wired: OpenRazer RazerBlackWidowV4X (USB_DEVICE_ID_RAZER_BLACKWIDOW_V4_X); OpenRGB "Razer Blackwidow V4 X".
[[usb]]
product_id = 0x0293
connection = "wired"
interface = 2   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
# effect: 0x1F (OpenRGB / research); OpenRazer sends matrix_effect_reactive 0x3F, matrix_effect_static 0x3F.
# Not used by uncoil, for reference: OpenRazer sends game_led_state 0xFF.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

[quirks]
# The BlackWidow V4 Pro 75% stops applying frames unless every reply is read; assumed for the rest of the V4
# family. Reading replies only costs time.
ack_every_report = true
custom_mode_once = true

[matrix]
# Matrix: OpenRGB razer_blackwidow_v4_x_layout (OpenRGB RazerDevices.cpp:419), applied to its base ANSI layout;
# see tools/devices/keyboard-matrices.json.
rows = 6
cols = 22
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["M6", "Escape", "", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11", "F12", "Print Screen", "Scroll Lock", "Pause", "", "", "", ""],
