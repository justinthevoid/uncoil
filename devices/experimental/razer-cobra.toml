# Razer Cobra (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - conflict: Per-LED/LED id: OpenRazer has no matrix and only logo effects (LOGO_LED 0x04); OpenRGB treats it
#   as 1x1 and sends effects to 0x05 (not in its LED-id-zero list, RazerController.cpp:81-176).
#   - PID 0x00A3: OpenRazer sends lighting with 0x1F but other commands with 0xFF (functions: majority)

id = "razer-cobra"
name = "Razer Cobra"
kind = "mouse"
vendor_id = 0x1532
support = "experimental"
# OpenRGB drives a 1x1 custom frame; OpenRazer has no matrix and only logo effects (LOGO_LED 0x04). Taking the
# conservative side: firmware effects only, until a report says frames work.
features = ["hw_effects", "keymap", "profiles", "dpi", "poll_rate"]

[sources]
openrazer = "mouse.py:1925 RazerCobra; razermouse_driver.c USB_DEVICE_ID_RAZER_COBRA (a84cd0ae)"
openrgb = "RazerDevices.cpp:5349 cobra_device; RazerControllerDetect.cpp:332 (df3024be)"

# wired: OpenRazer RazerCobra (USB_DEVICE_ID_RAZER_COBRA); OpenRGB "Razer Cobra".
[[usb]]
product_id = 0x00A3
connection = "wired"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
# effect: 0x1F (OpenRGB / research); OpenRazer sends matrix_effect_breath_common 0x3F.
# dpi: 0xFF, as OpenRazer sends dpi, dpi_stages.
# poll: 0xFF, as OpenRazer sends poll_rate.
# device: 0xFF, as OpenRazer sends device_mode, device_serial, firmware_version.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

[usb.transaction_ids]
dpi = 0xFF
poll = 0xFF
device = 0xFF

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
rows = 1
cols = 1
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Logo"],
]

[layout]
type = "points"
width = 2.4
depth = 5.8
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
points = [[0.0, 1.6]]

[hw_effects]
# OpenRazer's logo LED 0x04; OpenRGB sends effects to 0x05 (its default branch).
# Effects: OpenRazer's list for this device, mapped to uncoil's names. OpenRazer has no whole-device effects
# here; the list is its per-zone list.
led = 0x04
effects = ["off", "static", "breathing", "spectrum", "reactive"]

[dpi]
min = 100   # Neither source gives a minimum; 100 is the floor uncoil uses for the Basilisk V3 Pro and what Synapse offers on current mice.
max = 8500   # OpenRazer daemon DPI_MAX
# 04/05 storage byte NOSTORE, as OpenRazer sends it for almost every current mouse.
storage = "nostore"
stages_max = 5   # OpenRazer driver limit (RAZER_MOUSE_MAX_DPI_STAGES)

[poll_rate]
# Rates and command from OpenRazer (explicit POLL_RATES).
kind = "classic"
rates = [125, 500, 1000]
set_twice = false

[keymap]
# Contract section 2: experimental mice list only the common buttons; extra buttons wait for a hardware read
# (02/84). Ids and defaults as devices/razer-basilisk-v3-pro.toml (read from that mouse 2026-10-03).
get = 0x8C
set = 0x0C
layers = ["normal", "hypershift"]
keys = [
  { id = 1, name = "LEFT_CLICK", default = "button 1" },
  { id = 2, name = "RIGHT_CLICK", default = "button 2" },
  { id = 3, name = "WHEEL_CLICK", default = "button 3" },
  { id = 4, name = "BACK", default = "button 4" },
  { id = 5, name = "FORWARD", default = "button 5" },
  { id = 9, name = "WHEEL_UP", default = "button 9" },
  { id = 10, name = "WHEEL_DOWN", default = "button 10" },
]
