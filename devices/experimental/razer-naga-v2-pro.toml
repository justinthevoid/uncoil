# Razer Naga V2 Pro (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - conflict: PID 0x00A7 matrix: OpenRGB 1x2 vs OpenRazer 1x3
#   - conflict: PID 0x00A8 matrix: OpenRGB 1x2 vs OpenRazer 1x3
#   - OpenRGB calls it 'Naga Pro V2'. Set-DPI uses VARSTORE on this mouse (razermouse_driver.c, Naga group)
#   where most mice use NOSTORE.

id = "razer-naga-v2-pro"
name = "Razer Naga V2 Pro"
kind = "mouse"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects", "keymap", "profiles", "dpi", "poll_rate", "power"]

[sources]
openrazer = "mouse.py:1011 RazerNagaV2ProWired; mouse.py:1038 RazerNagaV2ProWireless; razermouse_driver.c USB_DEVICE_ID_RAZER_NAGA_V2_PRO_WIRED, USB_DEVICE_ID_RAZER_NAGA_V2_PRO_WIRELESS (a84cd0ae)"
openrgb = "RazerDevices.cpp:7185 naga_pro_v2_wired_device; RazerDevices.cpp:7205 naga_pro_v2_wireless_device; RazerControllerDetect.cpp:367; RazerControllerDetect.cpp:368 (df3024be)"

# wired: OpenRazer RazerNagaV2ProWired (USB_DEVICE_ID_RAZER_NAGA_V2_PRO_WIRED); OpenRGB "Razer Naga Pro V2
# (Wired)".
[[usb]]
product_id = 0x00A7
connection = "wired"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

# dongle: OpenRazer RazerNagaV2ProWireless (USB_DEVICE_ID_RAZER_NAGA_V2_PRO_WIRELESS); OpenRGB "Razer Naga Pro
# V2 (Wireless)".
[[usb]]
product_id = 0x00A8
connection = "dongle"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F
reply_wait_us = 31000   # OpenRazer RAZER_NEW_MOUSE_RECEIVER_WAIT_US

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
# OpenRGB 1x2 (logo, side number pad); OpenRazer 1x3. Using OpenRGB's, which names the LEDs and is the smaller
# of the two; a scroll-wheel LED may be the missing third.
rows = 1
cols = 2
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Logo", "Numpad"],
]

[layout]
type = "points"
width = 2.8
depth = 6.4
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
points = [[0.0, 1.8], [-1.5, -0.6]]

[hw_effects]
# LED id 0x00 (whole device): both sources.
# Effects: OpenRazer's list for this device, mapped to uncoil's names.
led = 0x00
effects = ["off", "static", "breathing", "spectrum", "reactive"]

[dpi]
min = 100   # Neither source gives a minimum; 100 is the floor uncoil uses for the Basilisk V3 Pro and what Synapse offers on current mice.
max = 30000   # OpenRazer daemon DPI_MAX
# 04/05 storage byte VARSTORE: OpenRazer sends set-DPI with VARSTORE on the Naga group, this mouse included
# (razermouse_driver.c), where most mice use NOSTORE.
storage = "varstore"
stages_max = 5   # OpenRazer driver limit (RAZER_MOUSE_MAX_DPI_STAGES)

[poll_rate]
# Rates and command from OpenRazer (daemon default (device_base.py:115)).
kind = "classic"
rates = [125, 500, 1000]
set_twice = false

[power]
# From OpenRazer's feature attributes for this device (charge level/status, idle time, low threshold).
battery = true
idle = true
low_battery = true

[keymap]
# Contract section 2: experimental mice list only the common buttons; extra buttons wait for a hardware read
# (02/84). Ids and defaults as devices/razer-basilisk-v3-pro.toml (read from that mouse 2026-10-03).
get = 0x8C
set = 0x0C
layers = ["normal", "hypershift"]
keys = [
  { id = 1, name = "LEFT_CLICK", default = "button 1" },
  { id = 2, name = "RIGHT_CLICK", default = "button 2" },
  { id = 3, name = "WHEEL_CLICK", default = "button 3" },
  { id = 4, name = "BACK", default = "button 4" },
  { id = 5, name = "FORWARD", default = "button 5" },
  { id = 9, name = "WHEEL_UP", default = "button 9" },
  { id = 10, name = "WHEEL_DOWN", default = "button 10" },
]
