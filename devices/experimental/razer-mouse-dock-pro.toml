# Razer Mouse Dock Pro (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - conflict: PID 0x00A4 matrix: OpenRGB 1x9 vs OpenRazer 1x8
#   - Transaction id 0xFF (both). OpenRGB notes wave works although the firmware does not list it; reactive is
#   listed but needs a linked device. 1x8 (OpenRazer) vs 1x9 (OpenRGB).

id = "razer-mouse-dock-pro"
name = "Razer Mouse Dock Pro"
kind = "other"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects"]

[sources]
openrazer = "accessory.py:97 RazerMouseDockPro; razeraccessory_driver.c USB_DEVICE_ID_RAZER_MOUSE_DOCK_PRO (a84cd0ae)"
openrgb = "RazerDevices.cpp:9143 mouse_dock_pro_device; RazerControllerDetect.cpp:436 (df3024be)"

# wired: OpenRazer RazerMouseDockPro (USB_DEVICE_ID_RAZER_MOUSE_DOCK_PRO); OpenRGB "Razer Mouse Dock Pro".
[[usb]]
product_id = 0x00A4
connection = "wired"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0xFF: both sources agree.
# effect: 0xFF (OpenRGB / research); OpenRazer sends matrix_effect_static 0x1F/0xFF.
transaction_id = 0xFF

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
# OpenRazer 1x8, OpenRGB 1x9 ('Base'). No recommendation; using the smaller one, so no frame byte goes to a slot
# that may not exist.
rows = 1
cols = 8
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Base 1", "Base 2", "Base 3", "Base 4", "Base 5", "Base 6", "Base 7", "Base 8"],
]

[layout]
type = "points"
width = 3.6
depth = 3.6
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
# Wireless charging puck: 8 LEDs drawn as a ring. Approximate.
points = [[0.0, -1.4], [0.99, -0.99], [1.4, 0.0], [0.99, 0.99], [0.0, 1.4], [-0.99, 0.99], [-1.4, 0.0], [-0.99, -0.99]]

[hw_effects]
# LED id 0x00 (whole device): both sources.
# Effects: OpenRazer's list for this device, mapped to uncoil's names.
led = 0x00
effects = ["off", "static", "breathing", "spectrum", "wave"]
