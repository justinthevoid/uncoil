# Razer Huntsman V3 Pro Tenkeyless (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - conflict: PID 0x02A7 transaction id: OpenRGB 0x3F vs OpenRazer driver 0x1F
#   - conflict: PID 0x02A7 matrix: OpenRGB 6x19 vs OpenRazer 6x22
#   - PID 0x02A7: OpenRazer sends lighting with 0x1F but other commands with 0xFF (functions:
#   razer_set_device_mode, read_game_led_state, write_game_led_state)
#   - Matrix 6x22 (OpenRazer, same as full-size) vs 6x19 (OpenRGB); OpenRazer's value looks copied from the full
#   board. Txn 0x1F vs 0x3F.

id = "razer-huntsman-v3-pro-tkl"
name = "Razer Huntsman V3 Pro Tenkeyless"
kind = "keyboard"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects", "keymap", "profiles"]

[sources]
openrazer = "keyboards.py:630 RazerHuntsmanV3ProTKL; razerkbd_driver.c USB_DEVICE_ID_RAZER_HUNTSMAN_V3_PRO_TKL (a84cd0ae)"
openrgb = "RazerDevices.cpp:3124 huntsman_v3_pro_tkl_device; RazerControllerDetect.cpp:262; razer_huntsman_v3_pro_tkl_layout (RazerDevices.cpp) (df3024be)"

# wired: OpenRazer RazerHuntsmanV3ProTKL (USB_DEVICE_ID_RAZER_HUNTSMAN_V3_PRO_TKL); OpenRGB "Razer Huntsman V3
# Pro TKL White".
[[usb]]
product_id = 0x02A7
connection = "wired"
interface = 3   # both sources agree
usage_page = 0x0C
usage = 0x01
# Sources disagree (OpenRazer 0x1F, OpenRGB 0x3F) and the research makes no recommendation: lighting commands
# use OpenRGB's value, everything else OpenRazer's. Confidence: low.
# frame: 0x3F (OpenRGB / research); OpenRazer sends matrix_custom_frame 0x1F, matrix_effect_custom 0x1F.
# effect: 0x3F (OpenRGB / research); OpenRazer sends matrix_brightness 0x1F, matrix_effect_breath 0x1F,
# matrix_effect_none 0x1F, matrix_effect_reactive 0x1F, matrix_effect_spectrum 0x1F, matrix_effect_starlight
# 0x1F, matrix_effect_static 0x1F, matrix_effect_wave 0x1F.
# device: 0xFF, as OpenRazer sends device_mode.
# Not used by uncoil, for reference: OpenRazer sends game_led_state 0xFF.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

[usb.transaction_ids]
frame = 0x3F
effect = 0x3F
device = 0xFF

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
# Matrix: OpenRGB razer_huntsman_v3_pro_tkl_layout (OpenRGB RazerDevices.cpp:1103), applied to its base ANSI
# layout; see tools/devices/keyboard-matrices.json.
# OpenRGB 6x19 with a per-key table; OpenRazer 6x22, which the research says looks copied from the full-size
# board. Using 6x19.
rows = 6
cols = 19
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["", "Escape", "", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11", "F12", "Game Bar", "Media Play/Pause", "", "Volume Dial"],
  ["", "`", "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", "Backspace", "Insert", "Home", "Page Up", ""],
  ["", "Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "[", "]", "\\", "Delete", "End", "Page Down", ""],
  ["", "Caps Lock", "A", "S", "D", "F", "G", "H", "J", "K", "L", ";", "'", "", "Enter", "", "", "", ""],
  ["", "Left Shift", "", "Z", "X", "C", "V", "B", "N", "M", ",", ".", "/", "", "Right Shift", "", "Up Arrow", "", ""],
  ["", "Left Control", "Left Windows", "Left Alt", "", "", "", "Space", "", "", "", "Right Alt", "Right Fn", "Menu", "Right Control", "Left Arrow", "Down Arrow", "Right Arrow", ""],
]

[layout]
type = "keyboard"
width = 18.25
depth = 6.25
# Physical rows (tkl ANSI), left to right from x = 0, in key units (1u = 19.05 mm).
# OpenRGB puts the Game Bar key, play/pause and the dial where Print Screen / Scroll Lock / Pause would be.
# Positions approximate.

[[layout.rows]]
y = 0.0
keys = ["Escape:1.0", "gap:1.0", "F1:1.0", "F2:1.0", "F3:1.0", "F4:1.0", "gap:0.5", "F5:1.0", "F6:1.0", "F7:1.0", "F8:1.0", "gap:0.5", "F9:1.0", "F10:1.0", "F11:1.0", "F12:1.0", "gap:0.25", "Game Bar:1.0", "Media Play/Pause:1.0", "Volume Dial:1.0"]

[[layout.rows]]
y = 1.25
keys = ["`:1.0", "1:1.0", "2:1.0", "3:1.0", "4:1.0", "5:1.0", "6:1.0", "7:1.0", "8:1.0", "9:1.0", "0:1.0", "-:1.0", "=:1.0", "Backspace:2.0", "gap:0.25", "Insert:1.0", "Home:1.0", "Page Up:1.0"]

[[layout.rows]]
y = 2.25
keys = ["Tab:1.5", "Q:1.0", "W:1.0", "E:1.0", "R:1.0", "T:1.0", "Y:1.0", "U:1.0", "I:1.0", "O:1.0", "P:1.0", "[:1.0", "]:1.0", "\\:1.5", "gap:0.25", "Delete:1.0", "End:1.0", "Page Down:1.0"]

[[layout.rows]]
y = 3.25
keys = ["Caps Lock:1.75", "A:1.0", "S:1.0", "D:1.0", "F:1.0", "G:1.0", "H:1.0", "J:1.0", "K:1.0", "L:1.0", ";:1.0", "':1.0", "Enter:2.25"]

[[layout.rows]]
y = 4.25
keys = ["Left Shift:2.25", "Z:1.0", "X:1.0", "C:1.0", "V:1.0", "B:1.0", "N:1.0", "M:1.0", ",:1.0", ".:1.0", "/:1.0", "Right Shift:2.75", "gap:1.25", "Up Arrow:1.0"]

[[layout.rows]]
y = 5.25
keys = ["Left Control:1.25", "Left Windows:1.25", "Left Alt:1.25", "Space:6.25", "Right Alt:1.25", "Right Fn:1.25", "Menu:1.25", "Right Control:1.25", "gap:0.25", "Left Arrow:1.0", "Down Arrow:1.0", "Right Arrow:1.0"]

[hw_effects]
# Backlight (LED id 5): both sources send keyboard effects there.
# Effects: OpenRazer's list for this device, mapped to uncoil's names.
led = 0x05
effects = ["off", "static", "breathing", "spectrum", "wave", "reactive", "starlight"]

[keymap]
# uncoil LED name -> [AT-101 key id, factory default]. Ids are the table in docs/blackwidow-keyids.json (Synapse
# names come from there too); defaults = the key itself, in the spec format of
# devices/razer-blackwidow-v4-pro-75.toml. Left Windows (AT-101 127, predicted but untested) and Fn have no id
# in that table, so they are left out, as on the BlackWidow V4 Pro 75%.
get = 0x8D
set = 0x0D
layers = ["normal", "hypershift"]
