# Razer Ornata V3 (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - PID 0x028F: OpenRazer sends lighting with 0x1F but other commands with 0xFF (functions:
#   read_game_led_state, write_game_led_state)
#   - PID 0x02A1: OpenRazer sends lighting with 0x1F but other commands with 0xFF (functions:
#   read_game_led_state, write_game_led_state)
#   - Two PIDs: 0x028F (OpenRazer RazerOrnataV3_Alternate / OpenRGB 'Ornata V3') and 0x02A1 (OpenRazer
#   RazerOrnataV3 / OpenRGB 'Ornata V3 rev2'). Zone-lit membrane, 10 zones.

id = "razer-ornata-v3"
name = "Razer Ornata V3"
kind = "keyboard"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects", "keymap", "profiles"]

[sources]
openrazer = "keyboards.py:928 RazerOrnataV3_Alternate; keyboards.py:909 RazerOrnataV3; razerkbd_driver.c USB_DEVICE_ID_RAZER_ORNATA_V3_ALT, USB_DEVICE_ID_RAZER_ORNATA_V3 (a84cd0ae)"
openrgb = "RazerDevices.cpp:2413 ornata_v3_device; RazerDevices.cpp:2448 ornata_v3_rev2_device; RazerControllerDetect.cpp:266; RazerControllerDetect.cpp:267 (df3024be)"

# wired: OpenRazer RazerOrnataV3_Alternate (USB_DEVICE_ID_RAZER_ORNATA_V3_ALT); OpenRGB "Razer Ornata V3".
[[usb]]
product_id = 0x028F
connection = "wired"
interface = 2   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
# Not used by uncoil, for reference: OpenRazer sends game_led_state 0xFF.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

# wired: OpenRazer RazerOrnataV3 (USB_DEVICE_ID_RAZER_ORNATA_V3); OpenRGB "Razer Ornata V3 rev2".
[[usb]]
product_id = 0x02A1
connection = "wired"
interface = 2   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
# Not used by uncoil, for reference: OpenRazer sends game_led_state 0xFF.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
# Zone-lit membrane board: both sources say 1x10 and OpenRGB has no per-key table (one linear 'KEYBOARD' zone).
rows = 1
cols = 10
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Zone 1", "Zone 2", "Zone 3", "Zone 4", "Zone 5", "Zone 6", "Zone 7", "Zone 8", "Zone 9", "Zone 10"],
]

[layout]
type = "points"
width = 22.5
depth = 6.25
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
# Ten zones spread evenly left to right across a full-size board. Which part of the board each zone covers is
# not documented; approximate.
points = [[-10.0, 0.0], [-7.78, 0.0], [-5.56, 0.0], [-3.33, 0.0], [-1.11, 0.0], [1.11, 0.0], [3.33, 0.0], [5.56, 0.0], [7.78, 0.0], [10.0, 0.0]]

[hw_effects]
# Backlight (LED id 5): both sources send keyboard effects there.
# Effects: OpenRazer's list for this device, mapped to uncoil's names.
led = 0x05
effects = ["off", "static", "breathing", "spectrum", "wave"]

[keymap]
# uncoil LED name -> [AT-101 key id, factory default]. Ids are the table in docs/blackwidow-keyids.json (Synapse
# names come from there too); defaults = the key itself, in the spec format of
# devices/razer-blackwidow-v4-pro-75.toml. Left Windows (AT-101 127, predicted but untested) and Fn have no id
# in that table, so they are left out, as on the BlackWidow V4 Pro 75%.
get = 0x8D
set = 0x0D
layers = ["normal", "hypershift"]
keys = [
  # No per-key LEDs on this board, so keys carry no led name.
  { id = 110, name = "ESC", default = "key ESCAPE" },
  { id = 112, name = "F1", default = "key F1" },
  { id = 113, name = "F2", default = "key F2" },
