# Razer Basilisk V3 35K (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - conflict: PID 0x00CB matrix: OpenRGB 1x11 vs OpenRazer 1x13
#   - Interface 3 like the Basilisk V3. Matrix 1x13 (OpenRazer) vs 1x11 (OpenRGB, same as Basilisk V3).

id = "razer-basilisk-v3-35k"
name = "Razer Basilisk V3 35K"
kind = "mouse"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects", "keymap", "profiles", "dpi", "poll_rate", "scroll"]

[sources]
openrazer = "mouse.py:1821 RazerBasiliskV3_35K; razermouse_driver.c USB_DEVICE_ID_RAZER_BASILISK_V3_35K (a84cd0ae)"
openrgb = "RazerDevices.cpp:4889 basilisk_v3_35k_device; RazerControllerDetect.cpp:322 (df3024be)"

# wired: OpenRazer RazerBasiliskV3_35K (USB_DEVICE_ID_RAZER_BASILISK_V3_35K); OpenRGB "Razer Basilisk V3 35K".
[[usb]]
product_id = 0x00CB
connection = "wired"
interface = 3   # both sources agree
usage_page = 0x0C
usage = 0x01
# transaction_id 0x1F: both sources agree.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
# OpenRGB 1x11 (logo, scroll wheel, 9-LED strip, same as the Basilisk V3); OpenRazer 1x13. Using OpenRGB's,
# which comes with LED names and is the smaller of the two.
rows = 1
cols = 11
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Logo", "Scroll Wheel", "Strip 1", "Strip 2", "Strip 3", "Strip 4", "Strip 5", "Strip 6", "Strip 7", "Strip 8", "Strip 9"],
]

[layout]
type = "points"
width = 2.8
depth = 6.4
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
# Strip drawn down the left side, around the back and up the right side. Approximate.
points = [[0.0, 1.8], [0.0, -2.2], [-1.4, -2.4], [-1.4, -0.9], [-1.4, 0.6], [-1.3, 2.1], [0.0, 3.0], [1.3, 2.1], [1.4, 0.6], [1.4, -0.9], [1.4, -2.4]]

[hw_effects]
# LED id 0x00 (whole device): both sources.
# Effects: OpenRazer's list for this device, mapped to uncoil's names. No breathing: OpenRGB turns firmware
# breathing off for the Basilisk V3 family.
led = 0x00
effects = ["off", "static", "spectrum", "wave"]

[dpi]
min = 100   # Neither source gives a minimum; 100 is the floor uncoil uses for the Basilisk V3 Pro and what Synapse offers on current mice.
max = 35000   # OpenRazer daemon DPI_MAX
# 04/05 storage byte NOSTORE, as OpenRazer sends it for almost every current mouse.
storage = "nostore"
stages_max = 5   # OpenRazer driver limit (RAZER_MOUSE_MAX_DPI_STAGES)

[poll_rate]
# Rates and command from OpenRazer (daemon default (device_base.py:115)).
kind = "classic"
rates = [125, 500, 1000]
set_twice = false

[scroll]
# From OpenRazer's feature attributes for this device (scroll mode, acceleration, Smart Reel); stored in
# the mouse (VARSTORE).
mode = true
acceleration = true
smart_reel = true

[keymap]
# Contract section 2: experimental mice list only the common buttons; extra buttons wait for a hardware read
# (02/84). Ids and defaults as devices/razer-basilisk-v3-pro.toml (read from that mouse 2026-10-03).
get = 0x8C
set = 0x0C
layers = ["normal", "hypershift"]
keys = [
  { id = 1, name = "LEFT_CLICK", default = "button 1" },
  { id = 2, name = "RIGHT_CLICK", default = "button 2" },
  { id = 3, name = "WHEEL_CLICK", default = "button 3" },
  { id = 4, name = "BACK", default = "button 4" },
  { id = 5, name = "FORWARD", default = "button 5" },
  { id = 9, name = "WHEEL_UP", default = "button 9" },
  { id = 10, name = "WHEEL_DOWN", default = "button 10" },
  { id = 52, name = "WHEEL_LEFT", default = "button 104" },
  { id = 53, name = "WHEEL_RIGHT", default = "button 105" },
]
# 52/53: tilt wheel left/right, as on the Basilisk V3 Pro.
