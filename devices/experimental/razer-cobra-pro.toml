# Razer Cobra Pro (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - conflict: Per-LED: OpenRazer has no matrix / custom frame for Cobra Pro (zone effects only: whole device
#   0x00, logo 0x04, scroll 0x01; mouse.py RazerCobraProWired METHODS), OpenRGB drives it as a 1x11 per-LED
#   matrix (RazerDevices.cpp).

id = "razer-cobra-pro"
name = "Razer Cobra Pro"
kind = "mouse"
vendor_id = 0x1532
support = "experimental"
# OpenRGB drives it as a 1x11 per-LED matrix; OpenRazer has no matrix or custom frame for the Cobra Pro, only
# zone effects. Taking the conservative side: firmware effects only, until a report says frames work.
features = ["hw_effects", "keymap", "profiles", "dpi", "poll_rate", "power"]

[sources]
openrazer = "mouse.py:1566 RazerCobraProWired; mouse.py:1595 RazerCobraProWireless; razermouse_driver.c USB_DEVICE_ID_RAZER_COBRA_PRO_WIRED, USB_DEVICE_ID_RAZER_COBRA_PRO_WIRELESS (a84cd0ae)"
openrgb = "RazerDevices.cpp:5408 cobra_pro_wired_device; RazerDevices.cpp:5467 cobra_pro_wireless_device; RazerControllerDetect.cpp:333; RazerControllerDetect.cpp:334 (df3024be)"

# wired: OpenRazer RazerCobraProWired (USB_DEVICE_ID_RAZER_COBRA_PRO_WIRED); OpenRGB "Razer Cobra Pro (Wired)".
[[usb]]
product_id = 0x00AF
connection = "wired"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
# low_battery: 0xFF, as OpenRazer sends charge_low_threshold.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

[usb.transaction_ids]
low_battery = 0xFF

# dongle: OpenRazer RazerCobraProWireless (USB_DEVICE_ID_RAZER_COBRA_PRO_WIRELESS); OpenRGB "Razer Cobra Pro
# (Wireless)".
[[usb]]
product_id = 0x00B0
connection = "dongle"
interface = 0   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x1F: both sources agree.
# low_battery: 0xFF, as OpenRazer sends charge_low_threshold.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F
reply_wait_us = 31000   # OpenRazer RAZER_NEW_MOUSE_RECEIVER_WAIT_US

[usb.transaction_ids]
low_battery = 0xFF

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
# OpenRGB's 1x11: logo, scroll wheel, 9-LED underglow, in that order.
rows = 1
cols = 11
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["Logo", "Scroll Wheel", "Underglow 1", "Underglow 2", "Underglow 3", "Underglow 4", "Underglow 5", "Underglow 6", "Underglow 7", "Underglow 8", "Underglow 9"],
]

[layout]
type = "points"
width = 2.5
depth = 6.0
# (x, y) of each LED relative to the device centre, in key units, matrix order. Approximate.
# Underglow drawn around the edge of the mouse. Approximate.
points = [[0.0, 1.6], [0.0, -2.0], [-1.3, -2.2], [-1.3, -0.8], [-1.3, 0.6], [-1.2, 2.0], [0.0, 2.8], [1.2, 2.0], [1.3, 0.6], [1.3, -0.8], [1.3, -2.2]]

[hw_effects]
# OpenRazer's whole-device effects (LED 0x00), which OpenRGB also uses.
# Effects: OpenRazer's list for this device, mapped to uncoil's names.
led = 0x00
effects = ["off", "static", "spectrum", "wave"]

[dpi]
min = 100   # Neither source gives a minimum; 100 is the floor uncoil uses for the Basilisk V3 Pro and what Synapse offers on current mice.
max = 30000   # OpenRazer daemon DPI_MAX
# 04/05 storage byte NOSTORE, as OpenRazer sends it for almost every current mouse.
storage = "nostore"
stages_max = 5   # OpenRazer driver limit (RAZER_MOUSE_MAX_DPI_STAGES)

[poll_rate]
# Rates and command from OpenRazer (daemon default (device_base.py:115)).
kind = "classic"
rates = [125, 500, 1000]
set_twice = false

[power]
# From OpenRazer's feature attributes for this device (charge level/status, idle time, low threshold).
battery = true
idle = true
low_battery = true

[keymap]
# Contract section 2: experimental mice list only the common buttons; extra buttons wait for a hardware read
# (02/84). Ids and defaults as devices/razer-basilisk-v3-pro.toml (read from that mouse 2026-10-03).
get = 0x8C
set = 0x0C
layers = ["normal", "hypershift"]
keys = [
  { id = 1, name = "LEFT_CLICK", default = "button 1" },
  { id = 2, name = "RIGHT_CLICK", default = "button 2" },
  { id = 3, name = "WHEEL_CLICK", default = "button 3" },
  { id = 4, name = "BACK", default = "button 4" },
  { id = 5, name = "FORWARD", default = "button 5" },
  { id = 9, name = "WHEEL_UP", default = "button 9" },
  { id = 10, name = "WHEEL_DOWN", default = "button 10" },
]
