# Razer BlackWidow V4 Pro (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - conflict: PID 0x028D: OpenRGB registers 2 HID collections (0x03/0x01/0x00; 0x03/0x0C/0x01) -
#   firmware-dependent usage page/usage
#   - HID collection depends on firmware (as BW V4; RazerControllerDetect.cpp:232-233).
#   - Has command dial and side/underglow LEDs in the 8x23 matrix.

id = "razer-blackwidow-v4-pro"
name = "Razer BlackWidow V4 Pro"
kind = "keyboard"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects", "keymap", "profiles", "poll_rate"]

[sources]
openrazer = "keyboards.py:2179 RazerBlackWidowV4Pro; razerkbd_driver.c USB_DEVICE_ID_RAZER_BLACKWIDOW_V4_PRO (a84cd0ae)"
openrgb = "RazerDevices.cpp:1853 blackwidow_v4_pro_device; RazerControllerDetect.cpp:232; RazerControllerDetect.cpp:233; razer_blackwidow_v4_pro_layout (RazerDevices.cpp) (df3024be)"

# wired: OpenRazer RazerBlackWidowV4Pro (USB_DEVICE_ID_RAZER_BLACKWIDOW_V4_PRO); OpenRGB "Razer Blackwidow V4
# Pro".
[[usb]]
product_id = 0x028D
connection = "wired"
interface = 3   # both sources agree
usage_page = 0x0C
usage = 0x01
# OpenRGB registers several HID collections on this interface; the first is the newer firmware's.
alt_usages = [[0x01, 0x00]]
# transaction_id 0x1F: both sources agree.
# Not used by uncoil, for reference: OpenRazer sends game_led_state 0xFF.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x1F

[quirks]
# The BlackWidow V4 Pro 75% stops applying frames unless every reply is read; assumed for the rest of the V4
# family. Reading replies only costs time.
ack_every_report = true
custom_mode_once = true

[matrix]
# Matrix: OpenRGB razer_blackwidow_v4_pro_layout (OpenRGB RazerDevices.cpp:339), applied to its base ANSI
# layout; see tools/devices/keyboard-matrices.json.
# 8x23 in both sources. OpenRGB appends zones 'Underglow Left' (9), 'Underglow Right' (9), 'Void' (5 placeholder
# slots, no LEDs) and 'Underglow Wrist Rest' (20) after the 6x23 keyboard zone, so row 6 = left 0-8, right 9-17,
# nothing in 18-22; row 7 = wrist rest 0-19. Strip directions are not known.
rows = 8
cols = 23
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["", "Dial", "Escape", "", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11", "F12", "Print Screen", "Scroll Lock", "Pause", "Media Previous", "Media Play/Pause", "Media Next", "Media Mute"],
  ["", "M5", "`", "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", "Backspace", "Insert", "Home", "Page Up", "Num Lock", "Numpad /", "Numpad *", "Numpad -"],
  ["", "M4", "Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "[", "]", "\\", "Delete", "End", "Page Down", "Numpad 7", "Numpad 8", "Numpad 9", "Numpad +"],
  ["", "M3", "Caps Lock", "A", "S", "D", "F", "G", "H", "J", "K", "L", ";", "'", "", "Enter", "", "", "", "Numpad 4", "Numpad 5", "Numpad 6", ""],
  ["", "M2", "Left Shift", "", "Z", "X", "C", "V", "B", "N", "M", ",", ".", "/", "", "Right Shift", "", "Up Arrow", "", "Numpad 1", "Numpad 2", "Numpad 3", "Numpad Enter"],
  ["", "M1", "Left Control", "Left Windows", "Left Alt", "", "", "", "Space", "", "", "", "Right Alt", "Right Fn", "Menu", "Right Control", "Left Arrow", "Down Arrow", "Right Arrow", "", "Numpad 0", "Numpad .", ""],
  ["LU0", "LU1", "LU2", "LU3", "LU4", "LU5", "LU6", "LU7", "LU8", "RU0", "RU1", "RU2", "RU3", "RU4", "RU5", "RU6", "RU7", "RU8", "", "", "", "", ""],
  ["WR0", "WR1", "WR2", "WR3", "WR4", "WR5", "WR6", "WR7", "WR8", "WR9", "WR10", "WR11", "WR12", "WR13", "WR14", "WR15", "WR16", "WR17", "WR18", "WR19", "", "", ""],
]

[layout]
type = "keyboard"
width = 24.0
depth = 7.75
# Physical rows (full ANSI), left to right from x = 0, in key units (1u = 19.05 mm).
# Command dial and M1-M5 drawn as a column left of the main block; the wrist-rest strip is drawn as a row of
# thin segments in front of the keyboard. Positions approximate.

[[layout.rows]]
y = 0.0
keys = ["Dial:1.0", "gap:0.5", "Escape:1.0", "gap:1.0", "F1:1.0", "F2:1.0", "F3:1.0", "F4:1.0", "gap:0.5", "F5:1.0", "F6:1.0", "F7:1.0", "F8:1.0", "gap:0.5", "F9:1.0", "F10:1.0", "F11:1.0", "F12:1.0", "gap:0.25", "Print Screen:1.0", "Scroll Lock:1.0", "Pause:1.0", "gap:0.25", "Media Previous:1.0", "Media Play/Pause:1.0", "Media Next:1.0", "Media Mute:1.0"]

