# Razer Huntsman Mini (experimental)
#
# Generated by tools/devices/gen_experimental.py from tools/reference/device-research/razer-devices.json
# (OpenRazer a84cd0ae, OpenRGB df3024be) and tools/devices/overrides.json. Do not edit by hand: change the
# generator's inputs and re-run it. Nobody has confirmed this file on real hardware yet; a report that it works
# moves it to devices/ (see CONTRIBUTING.md).
#
# Research notes:
#   - PID 0x0257: OpenRazer sends lighting with 0x3F but other commands with 0xFF (functions:
#   razer_set_device_mode, read_game_led_state, write_game_led_state)

id = "razer-huntsman-mini"
name = "Razer Huntsman Mini"
kind = "keyboard"
vendor_id = 0x1532
support = "experimental"
features = ["lighting", "hw_effects", "keymap", "profiles"]

[sources]
openrazer = "keyboards.py:1970 RazerHuntsmanMini; razerkbd_driver.c USB_DEVICE_ID_RAZER_HUNTSMAN_MINI (a84cd0ae)"
openrgb = "RazerDevices.cpp:2914 huntsman_mini_device; RazerControllerDetect.cpp:255; razer_huntsman_mini_layout (RazerDevices.cpp) (df3024be)"

# wired: OpenRazer RazerHuntsmanMini (USB_DEVICE_ID_RAZER_HUNTSMAN_MINI); OpenRGB "Razer Huntsman Mini".
[[usb]]
product_id = 0x0257
connection = "wired"
interface = 2   # both sources agree
usage_page = 0x01
usage = 0x02
# transaction_id 0x3F: both sources agree.
# device: 0xFF, as OpenRazer sends device_mode.
# Not used by uncoil, for reference: OpenRazer sends game_led_state 0xFF.
# keymap / profile commands are in neither source; they use transaction_id.
transaction_id = 0x3F

[usb.transaction_ids]
device = 0xFF

[quirks]
ack_every_report = false
custom_mode_once = true

[matrix]
# Matrix: OpenRGB razer_huntsman_mini_layout (OpenRGB RazerDevices.cpp:994), applied to its base ANSI layout;
# see tools/devices/keyboard-matrices.json.
rows = 5
cols = 15
# Name of the LED at each (row, col); "" = no LED.
names = [
  ["", "Escape", "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", "Backspace"],
  ["", "Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "[", "]", "\\"],
  ["", "Caps Lock", "A", "S", "D", "F", "G", "H", "J", "K", "L", ";", "'", "", "Enter"],
  ["", "Left Shift", "", "Z", "X", "C", "V", "B", "N", "M", ",", ".", "/", "", "Right Shift"],
  ["", "Left Control", "Left Windows", "Left Alt", "", "", "", "Space", "", "", "", "Right Alt", "Right Fn", "Menu", "Right Control"],
]

[layout]
type = "keyboard"
width = 15.0
depth = 5.0
# Physical rows (60 ANSI), left to right from x = 0, in key units (1u = 19.05 mm).

[[layout.rows]]
y = 0.0
keys = ["Escape:1.0", "1:1.0", "2:1.0", "3:1.0", "4:1.0", "5:1.0", "6:1.0", "7:1.0", "8:1.0", "9:1.0", "0:1.0", "-:1.0", "=:1.0", "Backspace:2.0"]

[[layout.rows]]
y = 1.0
keys = ["Tab:1.5", "Q:1.0", "W:1.0", "E:1.0", "R:1.0", "T:1.0", "Y:1.0", "U:1.0", "I:1.0", "O:1.0", "P:1.0", "[:1.0", "]:1.0", "\\:1.5"]

[[layout.rows]]
y = 2.0
keys = ["Caps Lock:1.75", "A:1.0", "S:1.0", "D:1.0", "F:1.0", "G:1.0", "H:1.0", "J:1.0", "K:1.0", "L:1.0", ";:1.0", "':1.0", "Enter:2.25"]

[[layout.rows]]
y = 3.0
keys = ["Left Shift:2.25", "Z:1.0", "X:1.0", "C:1.0", "V:1.0", "B:1.0", "N:1.0", "M:1.0", ",:1.0", ".:1.0", "/:1.0", "Right Shift:2.75"]

[[layout.rows]]
y = 4.0
keys = ["Left Control:1.25", "Left Windows:1.25", "Left Alt:1.25", "Space:6.25", "Right Alt:1.25", "Right Fn:1.25", "Menu:1.25", "Right Control:1.25"]

[hw_effects]
# Backlight (LED id 5): both sources send keyboard effects there.
# Effects: OpenRazer's list for this device, mapped to uncoil's names.
led = 0x05
effects = ["off", "static", "breathing", "spectrum", "wave", "reactive", "starlight"]

[keymap]
# uncoil LED name -> [AT-101 key id, factory default]. Ids are the table in docs/blackwidow-keyids.json (Synapse
# names come from there too); defaults = the key itself, in the spec format of
# devices/razer-blackwidow-v4-pro-75.toml. Left Windows (AT-101 127, predicted but untested) and Fn have no id
# in that table, so they are left out, as on the BlackWidow V4 Pro 75%.
get = 0x8D
set = 0x0D
layers = ["normal", "hypershift"]
